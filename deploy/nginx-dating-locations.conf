# CubeOS dating backend (cubeos-dating, 127.0.0.1:8098). Included in the :80 server of
# /etc/nginx/sites-enabled/cubeos. Only the Cube App API is published; the /dating prefix is stripped.
# Alovoa's own web UI stays private (reach it with an SSH tunnel to 127.0.0.1:8098).
location /dating/api/v1/cube/photo/ {
    limit_req zone=dating_media burst=120 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8098/api/v1/cube/photo/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Set-Cookie;
}
location /dating/api/v1/cube/ {
    limit_req zone=dating burst=60 nodelay;
    limit_req_status 429;
    client_max_body_size 11M;
    proxy_pass http://127.0.0.1:8098/api/v1/cube/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Set-Cookie;
    proxy_read_timeout 60s;
}
location /dating/ {
    default_type application/json;
    return 404 '{"error":"Not found."}';
}
