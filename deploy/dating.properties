# CubeOS dating backend -- non-secret production settings.
# Installed to /opt/cubeos/dating/dating.properties and loaded with
# --spring.config.additional-location. Secrets (DB password, encryption keys, admin key) come from
# /etc/cubeos/dating.env (EnvironmentFile of cubeos-dating.service).

server.address=127.0.0.1
server.port=8098
server.forward-headers-strategy=native
server.tomcat.threads.max=64
server.tomcat.accept-count=50

spring.datasource.url=jdbc:mariadb://127.0.0.1:3306/cubeos_dating?serverTimezone=UTC&useLegacyDatetimeCode=false
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.jpa.show-sql=false

# No outgoing mail: Cube App users are notified in the app, never by e-mail.
spring.mail.host=localhost
spring.mail.test-connection=false

# Alovoa's Google/Facebook login is not used; placeholders keep Spring's OAuth client config valid.
spring.security.oauth2.client.registration.google.client-id=disabled
spring.security.oauth2.client.registration.google.client-secret=disabled
spring.security.oauth2.client.registration.facebook.client-id=disabled
spring.security.oauth2.client.registration.facebook.client-secret=disabled

# 18+ everywhere, including Alovoa's own registration (the Cube API enforces 18 regardless).
app.age.min=18

app.domain=http://109.122.27.74/dating
app.url.front-end=http://109.122.27.74/dating
app.company.name=CubeOS
app.name=Cube Dating

# journald only (no ./logs/spring.log)
logging.file.name=
logging.level.org.springframework.web=WARN

cube.cubemail.url=https://realiax.org/api/cubemail
cube.registrar.url=http://127.0.0.1/cubeline
cube.photo-url-prefix=/dating/api/v1/cube/photo/
