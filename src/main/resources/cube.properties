# CubeOS -- Cube App dating backend settings. Imported from application.properties.
# Values here override upstream defaults; profile files (application-<profile>.properties) and the
# environment still override these.

# 18+ only: the Cube API enforces 18 regardless of app.age.min (CubeProfileService.LEGAL_MIN_AGE).
# app.age.min=18 is set in the production config (deploy/dating.properties) rather than here, because
# upstream's own tests exercise under-18 accounts with the default of 16.
# Cube App: up to 6 photos = 1 profile picture + 5 extra images.
app.profile.image.max=5
# Discover radius 1..200 km.
app.search.max.distance=200
# Allow realistic first names (upstream default is 10).
app.first-name.length-max=30
# Behind nginx: take the client address from X-Forwarded-For (bucket4j rate limits per client IP).
server.forward-headers-strategy=native

# Cubemail validates the Cube App bearer token (same as backend/cubeline-registrar/registrar.py).
cube.cubemail.url=https://realiax.org/api/cubemail
# Cubeline registrar on the same host (nginx :80 /cubeline/).
cube.registrar.url=http://127.0.0.1/cubeline
cube.http.timeout-seconds=15
# How long a validated token -> handle mapping is cached.
cube.token-cache-seconds=300
# Photo URLs handed to the app (relative; the app prefixes the host).
cube.photo-url-prefix=/dating/api/v1/cube/photo/
# Locations older than this fall out of discovery.
cube.location.max-age-days=30
cube.email-domain=cubemail.io
